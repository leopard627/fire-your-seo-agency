name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 1 * *"  # monthly: is the AI crawler table still current?
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python3 tools/validate.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      # Only on the schedule, so an aging date never blocks an unrelated PR.
      - name: Crawler table freshness
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tools/validate.py --max-age 100
